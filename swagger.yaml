                $ref: '#/components/schemas/TResultVisitor'
  /accesses:
    post:
      tags:
        - accesses
      summary: 'Crear acceso (genera QR automáticamente)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultAccess'
  /accesses/datatable:
    post:
      tags:
        - accesses
      summary: 'Listado paginado de accesos'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
