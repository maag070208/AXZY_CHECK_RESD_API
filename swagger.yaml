            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '400':
          description: 'Error de validación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '403':
          description: 'Prohibido (No es administrador)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '404':
          description: 'No encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  /users/logout:
    post:
      tags:
        - auth
      summary: 'Cerrar sesión'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  /residents:
    post:
      tags:
        - residents
      summary: 'Crear residente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
        '400':
