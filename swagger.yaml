              schema:
                $ref: '#/components/schemas/TResultVisitor'
    put:
      tags:
        - visitors
      summary: 'Actualizar visitante'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorUpdate'
      responses:
