openapi: 3.0.3
info:
  title: 'AXZY CHECK API'
  description: "Documentación técnica completa de la API de AXZY CHECK. Cubre gestión\noperativa, administrativa y analítica."
  version: 1.3.2
servers:
  -
    url: 'http://localhost:4444/api/v1'
    description: 'Local server'
tags:
  -
    name: auth
    description: 'Control de acceso'
  -
    name: users
    description: 'Personal y administración'
  -
    name: residents
    description: Residentes
  -
    name: contacts
    description: 'Contactos de residentes'
  -
    name: zones
    description: 'Áreas/Zonas geográficas'
  -
    name: locations
    description: 'Puntos de control / Spots'
  -
    name: assignments
    description: 'Órdenes de trabajo y tareas'
  -
    name: rounds
    description: 'Recorridos de seguridad'
  -
    name: incidents
    description: 'Gestión de anomalías'
  -
    name: maintenance
    description: 'Soporte técnico'
  -
    name: schedules
    description: 'Horarios y turnos'
  -
    name: kardex
    description: 'Bitácora de actividad'
  -
    name: reports
    description: 'Analítica y KPIs'
  -
    name: settings
    description: 'Configuración maestra y catálogos'
  -
    name: sync
    description: 'Sincronización móvil offline'
  -
    name: recurring
    description: 'Tareas recurrentes'
  -
    name: catalog
    description: 'Listas rápidas de sistema'
  -
    name: home
    description: 'Métricas y dashboard de inicio'
  -
    name: houses
    description: 'Casas del residencial'
  -
    name: vehicles
    description: 'Vehículos registrados'
  -
    name: visitors
    description: Visitantes
  -
    name: accesses
    description: 'Control de accesos con QR'
  -
    name: access-logs
    description: 'Registros de entrada y salida'
  -
    name: complaints
    description: 'Quejas y categorías'
  -
    name: payments
    description: 'Pagos y cuotas'
  -
    name: notifications
    description: 'Notificaciones a usuarios'
paths:
  /home/stats:
    get:
      tags:
        - home
      summary: 'Obtener métricas para el dashboard'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {type: object, properties: {activeRoundsCount: {type: integer}, activeRounds: {type: array, items: {$ref: '#/components/schemas/Round'}}, pendingIncidentsCount: {type: integer}, pendingMaintenanceCount: {type: integer}}}
                  messages: {type: array, items: {type: string}}
  /users/login:
    post:
      tags:
        - auth
      summary: 'Iniciar sesión'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLogin'
        '401':
          description: 'No autorizado (Credenciales inválidas)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '403':
          description: 'Prohibido (Cuenta inactiva o fuera de horario)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  /users:
    get:
      tags:
        - users
      summary: 'Listar usuarios'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultListUser'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
    post:
      tags:
        - users
      summary: 'Crear usuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '400':
          description: 'Error de validación o usuario duplicado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  /users/datatable:
    post:
      tags:
        - users
      summary: 'Tabla paginada de usuarios'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDatatableUser'
        '400':
          description: 'Error en filtros o paginación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  '/users/{id}':
    get:
      tags:
        - users
      summary: 'Detalle de usuario'
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDatatable'
        '400':
          description: 'Petición inválida'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '404':
          description: 'No encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
    put:
      tags:
        - users
      summary: 'Actualizar usuario'
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '400':
          description: 'Error de validación o usuario duplicado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '404':
          description: 'No encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
    delete:
      tags:
        - users
      summary: 'Eliminar usuario'
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '400':
          description: 'Petición inválida'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '404':
          description: 'No encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  '/users/{id}/password':
    put:
      tags:
        - users
      summary: 'Cambiar contraseña (Usuario propio)'
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '400':
          description: 'Error de validación o contraseña incorrecta'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '401':
          description: 'No autorizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '404':
          description: 'No encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
  '/users/{id}/reset-password':
    put:
      tags:
